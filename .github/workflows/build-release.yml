name: Build release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build desktop JAR and Windows bundle
        shell: pwsh
        run: |
          .\gradlew.bat desktop:release desktop:jpackageImage --no-daemon

      - name: Stage release folder
        shell: pwsh
        run: |
          $ver = (Select-String -Path build.gradle -Pattern "appVersionName\s*=\s*'([^']+)'").Matches.Groups[1].Value
          $slug = "Shattered-Pixel-Dungeon-QoL-$ver"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "desktop/build/libs/desktop-$ver.jar" "release/$slug-desktop.jar"
          Compress-Archive -Path "desktop/build/jpackage/Shattered Pixel Dungeon QoL" -DestinationPath "release/$slug-windows-x64.zip"

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: release/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Configure release signing
        if: secrets.ANDROID_KEYSTORE_BASE64
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=android/release.keystore
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      - name: Build signed APK
        if: secrets.ANDROID_KEYSTORE_BASE64
        run: ./gradlew android:assembleRelease --no-daemon

      - name: Stage APK
        if: secrets.ANDROID_KEYSTORE_BASE64
        run: |
          VER=$(grep -oP "appVersionName\s*=\s*'\K[^']+" build.gradle)
          mkdir -p release
          cp android/build/outputs/apk/release/android-release.apk "release/Shattered-Pixel-Dungeon-QoL-${VER}-android.apk"

      - name: Upload Android artifact
        if: secrets.ANDROID_KEYSTORE_BASE64
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release/*.apk
