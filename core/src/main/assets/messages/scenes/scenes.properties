scenes.modchangesscene.body_overview=Singleplayer additions in this build of Shattered Pixel Dungeon: quality-of-life options, and pacts.\n\nPacts are optional rules you choose before a run. They are not challenges. They do not change your challenge count, Champion badges, or score.\n\nYou can turn pacts on from hero select. Mix any of them, or roll a random set. Daily runs and custom seeds cannot use Command, Rebirth, or Legacy.\n\nUse the tabs below for Quality of Life settings and each pact group. Official Shattered patch notes stay under title **Changes**.
scenes.modchangesscene.body_qol=These live in **Settings → Quality of Life**.\n\n**-** **Tile indicator on hover.** The tile under the cursor is marked.\n**-** **Quickslots shown.** Auto, or a fixed row of 1 to 6 slots.\n**-** **Show second quickslot bar.** The extra quickslot bank (slots 7-12). Off hides that row; items assigned there stay put.\n**-** **Show quickslot swap button.** A button to switch quickslot sets.\n**-** **Center hero on Switch Target.** If you press the enemy-cycle button and nothing is left to target, the camera returns to you.\n**-** **Boss health bar for targeted enemies.** The large health bar also tracks the enemy you have targeted, not only bosses.\n**-** **Show turn counts on small buff icons.** Short durations show a number on the small icon.\n**-** **Show augment icons on equipment.** Augmented weapons and armor show an icon in your inventory and quickslots.\n**-** **Auto-apply talents.** Talent points spend themselves in the order you planned.\n\nOn desktop, the same tab can flip the status pane and reset the HUD layout. On Android, it includes the edge-zoom gesture.
scenes.modchangesscene.body_hero=Rules on you and your allies.\n\n**-** **Death.** You have one life. Ankhs do not bring you back.\n**-** **Frailty.** Falling down a chasm kills you. A feather-fall elixir still saves you.\n**-** **Glass.** You and your allies have very little health: yours is about your level, plus a little from extra health sources such as a Ring of Might. Melee hits from you and your allies deal five times as much damage. Thrown weapons are not multiplied.\n**-** **Devotion.** Allies stay on the floor where you leave them. They do not follow you down. A corrupted ally no longer wastes away. Mirror images are not included.\n**-** **Crimson.** A strike that draws blood restores you, about a quarter of the damage that landed. Ordinary healing does not: potions, dew, sungrass, and the waterskin will not refill your health. A thrown potion of healing bursts on an enemy, deals a little damage, and poisons them.\n**-** **Grave.** Your hands do not strike. Shades swing the weapon you carry, at that weapon's reach and speed. Their hits identify it. A weapon that is too heavy for you is slower and less accurate in their hands, and it cannot strike unseen. Up to four can be out, and they return on their own clocks. A melee click, a wand zap, or a shot calls a ready shade; that same action does not also shorten the next clock. A chalice can call the next one early, at a cost in health and hunger. Most wands and the spirit bow feed a shade instead of wounding the enemy you aimed at. Warding still places wards. Living earth still builds rock armor and can call its guardian, without wounding that enemy. A zap or a cone counts once, on the enemy you aimed at.\n**-** **Chimera.** When the run loads, you draft each of your four opening (T1) talent slots from four offered talents. Tier 2 and 3 class talents are still rolled at random. Tengu's mask and the King's crown each offer three choices drawn from distinct classes (with at most one from your own). The first time you take a subclass or armor ability from a class, you gain that class's signature item: the Warrior's broken seal, the Mage's staff, the Rogue's cloak, the Huntress's spirit bow, or the Cleric's holy tome. The Duelist grants no extra item.
scenes.modchangesscene.body_foes=Who is in the dungeon, and what they do.\n\n**-** **Honor.** Every enemy is a champion.\n**-** **Evolution.** Enemies grow as you reach new depths. Each new deepest floor adds 2% to them, up to 50%. After a Legacy loop, floor 1 starts at that 50% (or higher, if an earlier loop grew past it) and each new deepest floor adds 1%.\n**-** **Dissonance.** Any foe may show up on a floor. One that belongs deeper is weaker when it arrives early. One that belongs shallower is worth more experience when it arrives late.\n**-** **Kin.** Each floor is a single species.\n**-** **Swarms.** A solid hit can split a foe in two. Each half keeps half the health.\n**-** **Spite.** A hostile death leaves lit bombs. Deeper, tougher foes leave more, scattered around the corpse.\n**-** **Soul.** A hostile that dies leaves a wraith. A fall into a pit does not. The wraith itself does not leave another.
scenes.modchangesscene.body_spoils=Items, shops, and what carries between runs.\n\n**-** **Command.** When you claim dungeon or shop loot, you may pick another item of the same kind. Cancel leaves the item where it was. Not available on daily or custom-seed runs.\n**-** **Enigma.** On your first step into the dungeon, consumables and spare gear in your bag are replaced. What you have equipped stays put, unless Metamorphosis is also on.\n**-** **Metamorphosis.** On your first step into the dungeon, the gear you are wearing remakes itself. Unique class items mostly stay; a Mage's Staff remakes the wand inside it.\n**-** **Sacrifice.** Loose treasure on a normal floor is carried by the monsters there. Kill the carrier to claim it. Locked rooms, secrets, puzzles, crystal chests, and shops keep what they hold. Keys and quest items stay on the ground.\n**-** **Rebirth.** Each new Rebirth run starts with a gift. At the Amulet you may leave one item to choose the next run's gift. If that slot is empty, chance fills it. Not available on daily or custom-seed runs.\n**-** **Legacy.** At the Amulet you may end the run, or begin again. Each loop you may keep one more piece of gear (a weapon, armor, ring, artifact, wand, or trinket), and it returns on later loops. From the second loop on, enemies grow by 1% for each new deepest floor. Not available on daily or custom-seed runs.\n**-** **Guild.** Each shop keeps one trade, and pays more when you sell that trade back. The prison shop stocks weapons, the caves shop armor, the city shop wands, rings, and an artifact, and the imp stocks supplies. Gear on the shelf keeps its rolled level and curse, hidden until you buy it.
